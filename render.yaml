services:
  - type: web
    name: codelearn
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./apps/client/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
